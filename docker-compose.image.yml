name: procal-core

services:
  db:
    image: linuxserver/mariadb:11.4.8
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${PROCAL_SELF_DB_ROOT_PASSWORD:?Set PROCAL_SELF_DB_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=${PROCAL_SELF_DB_NAME:-procal}
      - MYSQL_USER=${PROCAL_SELF_DB_USER:-procal}
      - MYSQL_PASSWORD=${PROCAL_SELF_DB_PASSWORD:?Set PROCAL_SELF_DB_PASSWORD in .env}
      - TZ=${TZ:-Europe/Sofia}
    volumes:
      - procal_core_db:/config
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: ${PROCAL_CORE_IMAGE:?Set PROCAL_CORE_IMAGE in .env}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - CONFIG_PATH=/app/config/config.json
      - BACKUP_DIR=/app/backups
      - LOG_LEVEL=${PROCAL_SELF_LOG_LEVEL:-info}
      - TZ=${TZ:-Europe/Sofia}
      - PROCAL_TRUST_PROXY=${PROCAL_SELF_TRUST_PROXY:-0}
      - PROCAL_CORS_ALLOWED_ORIGINS=${PROCAL_CORS_ALLOWED_ORIGINS:-}
      - FILES_MAX_BYTES=${PROCAL_SELF_FILES_MAX_BYTES:-0}
      - FILES_STORAGE_LIMIT_BYTES=${PROCAL_SELF_FILES_STORAGE_LIMIT_BYTES:-0}
      - ACCESS_TTL_SEC=${PROCAL_SELF_ACCESS_TTL_SEC:-900}
      - REFRESH_TTL_SEC=${PROCAL_SELF_REFRESH_TTL_SEC:-1209600}
      - PROCAL_RELEASE_CHANNEL=self
      - REALM_RELEASE_CHANNEL=self
      - PROCAL_APP_VERSION=${PROCAL_SELF_APP_VERSION:-0.9.9-community}
      - PROCAL_UPDATER_URL=http://updater:7070
      - PROCAL_UPDATER_TOKEN=${PROCAL_UPDATER_TOKEN:?Set PROCAL_UPDATER_TOKEN in .env}
      - PROCAL_FCM_SERVICE_ACCOUNT_JSON_BASE64=${PROCAL_FCM_SERVICE_ACCOUNT_JSON_BASE64:-}
      - PROCAL_PUSH_PAYLOAD_MODE=${PROCAL_PUSH_PAYLOAD_MODE:-generic}
      - FIRST_ADMIN_SETUP_TOKEN=${PROCAL_SELF_SETUP_TOKEN:?Set PROCAL_SELF_SETUP_TOKEN in .env}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${PROCAL_SELF_DB_NAME:-procal}
      - DB_USER=${PROCAL_SELF_DB_USER:-procal}
      - DB_PASSWORD=${PROCAL_SELF_DB_PASSWORD:?Set PROCAL_SELF_DB_PASSWORD in .env}
    ports:
      - "${PROCAL_SELF_BIND_IP:-0.0.0.0}:${PROCAL_SELF_PORT:-8080}:8080"
    volumes:
      - procal_core_config:/app/config
      - procal_core_backups:/app/backups
    labels:
      - io.procal.updater.target=true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const req=http.get('http://127.0.0.1:8080/health',(res)=>{process.exit(res.statusCode===200?0:1);});req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1);});"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  updater:
    image: ${PROCAL_UPDATER_IMAGE:-ghcr.io/teo-vortex/procal-core-updater:latest}
    restart: unless-stopped
    environment:
      - PORT=7070
      - PROCAL_UPDATER_TOKEN=${PROCAL_UPDATER_TOKEN:?Set PROCAL_UPDATER_TOKEN in .env}
      - PROCAL_UPDATE_IMAGE=${PROCAL_CORE_IMAGE:?Set PROCAL_CORE_IMAGE in .env}
      - PROCAL_UPDATE_ALLOWED_IMAGE=${PROCAL_UPDATE_ALLOWED_IMAGE:-ghcr.io/teo-vortex/procal-core-public}
      - PROCAL_UPDATE_GITHUB_REPO=${PROCAL_UPDATE_GITHUB_REPO:-Teo-Vortex/ProCal-core-public}
      - PROCAL_UPDATE_HEALTH_TIMEOUT_SEC=${PROCAL_UPDATE_HEALTH_TIMEOUT_SEC:-180}
      - PROCAL_UPDATE_PULL_MODE=${PROCAL_UPDATE_PULL_MODE:-always}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - procal_core_updater:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const req=http.get('http://127.0.0.1:7070/health',(res)=>{process.exit(res.statusCode===200?0:1);});req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1);});"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  procal_core_config: {}
  procal_core_db: {}
  procal_core_backups: {}
  procal_core_updater: {}
