name: Bug report
description: Report a reproducible problem in ProCal Core Public
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ProCal Core Public.

        Do not include passwords, setup tokens, API keys, Firebase credentials, private calendar data, personal data, database exports, or unredacted logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProCal version
      description: Find this in the main menu or container image tag.
      placeholder: 0.9.9-community or v0.9.9-beta.3
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Docker Compose image
        - Docker Compose source build
        - ZimaOS
        - Home Assistant host
        - Other Docker host
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and host environment
      description: Include browser, operating system, CPU architecture, and relevant reverse proxy.
      placeholder: Chrome 128, ZimaOS x86_64, no reverse proxy
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Optional. Remove all secrets, tokens, private URLs, usernames, and personal data first.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report and removed secrets, credentials, private data, and personal data.
          required: true
