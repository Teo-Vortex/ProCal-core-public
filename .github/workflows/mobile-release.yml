name: Publish Android release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-release.yml"
      - "release-assets/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release tag
        shell: bash
        run: |
          RELEASE_TAG="$(git tag --sort=-version:refname | head -n 1)"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "No valid version tag found." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify release assets
        shell: bash
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "ProCal Core Public $RELEASE_TAG" \
              --notes-file release-assets/RELEASE_NOTES.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --title "ProCal Core Public $RELEASE_TAG" \
              --notes-file release-assets/RELEASE_NOTES.md \
              --latest
          fi

          gh release upload "$RELEASE_TAG" \
            release-assets/ProCal-Android-v0.9.9.apk \
            release-assets/SHA256SUMS.txt \
            --clobber
