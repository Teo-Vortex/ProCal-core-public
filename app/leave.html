<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ProCal Leave</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    try {
      if (localStorage.getItem("procal_theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (_) {}
  </script>
  <style>
    :root { --line:#dbe3ec; --ink:#1f2937; --muted:#6b7280; --bg:#f3f5f8; --card:#ffffff; --accent:#0f766e; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { width:100%; max-width:none; margin:0; padding:0.65rem clamp(0.75rem, 1.25vw, 1.5rem) 0.9rem; }
    .head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .page-brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .page-brand img { width:44px; height:44px; flex:0 0 auto; }
    .head h1 { margin:0; }
    .muted { color:var(--muted); font-size:13px; }
    .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 10px; cursor:pointer; }
    .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .pending-indicator { font-weight:700; }
    .pending-indicator.has-pending { border-color:#f59e0b; background:#fffbeb; color:#92400e; }
    .card { margin-top:12px; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:10px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .layout { display:grid; gap:12px; grid-template-columns: minmax(0, 1fr); min-height: calc(100vh - 210px); }
    .matrix-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; height:100%; min-height: calc(100vh - 250px); }
    .matrix { border-collapse: collapse; width:max-content; min-width:100%; }
    .matrix th, .matrix td { border-bottom:1px solid #eef2f7; border-right:1px solid #eef2f7; padding:4px 6px; text-align:center; font-size:12px; }
    .matrix th.sticky-left, .matrix td.sticky-left { position:sticky; left:0; background:#fff; z-index:2; min-width:170px; text-align:left; }
    .matrix thead th { position:sticky; top:0; background:#f8fafc; z-index:3; }
    .matrix th:last-child, .matrix td:last-child { min-width:290px; width:290px; text-align:left; }
    .user-cell { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .user-meta { margin-top:2px; font-size:11px; color:var(--muted); line-height:1.2; }
    .user-comp { font-size:11px; font-weight:700; margin-top:2px; }
    .user-comp.pos { color:#166534; }
    .user-comp.neg { color:#991b1b; }
    .user-comp.neu { color:#475569; }
    .user-name { font-weight:600; }
    .user-details-btn { padding:4px 8px; font-size:11px; }
    .cell { min-width:26px; height:24px; border-radius:6px; font-size:11px; font-weight:700; line-height:16px; padding:2px 0; }
    .cell.pending { border:1px dashed #64748b; }
    .t-paid { background:#dbeafe; color:#1e3a8a; }
    .t-sick { background:#fee2e2; color:#991b1b; }
    .t-unpaid { background:#f3f4f6; color:#374151; }
    .t-study { background:#dcfce7; color:#166534; }
    .t-work { background:#fff7ed; color:#9a3412; }
    label { font-size:13px; color:var(--muted); display:grid; gap:4px; }
    input, select, textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 8px; font:inherit; }
    textarea { min-height:64px; resize:vertical; }
    .legend { display:flex; gap:8px; flex-wrap:wrap; }
    .legend .badge { border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:12px; }
    .records { max-height:none; height: min(42vh, 520px); overflow:auto; border:1px solid var(--line); border-radius:10px; }
    .record { display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center; border-bottom:1px solid #eef2f7; padding:6px 8px; }
    .record:last-child { border-bottom:0; }
    .record-actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .summary-cell { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .summary-badge { border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; }
    .hidden { display:none !important; }
    .modal { position:fixed; inset:0; z-index:30; background:rgba(15,23,42,.42); display:grid; place-items:center; padding:12px; }
    .modal-card { width:min(680px, 96vw); max-height:90vh; overflow:auto; border:1px solid var(--line); border-radius:12px; background:#fff; padding:10px; }
    .modal-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .detail-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:8px; margin-top:8px; }
    .detail-box { border:1px solid var(--line); border-radius:10px; padding:8px; background:#f8fafc; }
    .detail-box h4 { margin:0 0 6px; font-size:13px; }
    .detail-line { display:flex; justify-content:space-between; gap:8px; font-size:12px; margin:2px 0; }
    #status { min-height: 18px; }
    :root[data-theme="dark"] { --line:rgba(184,208,216,.24); --ink:#e6edf0; --muted:#a6bac3; --bg:#071017; --card:#102531; --accent:#36d6bf; color-scheme:dark; }
    :root[data-theme="dark"] body { background:radial-gradient(900px 520px at 8% 0%,rgba(54,214,191,.12),transparent 62%),linear-gradient(180deg,#071017,#0a1720); color:var(--ink); }
    :root[data-theme="dark"] .card,:root[data-theme="dark"] .modal-card,:root[data-theme="dark"] .matrix-wrap,:root[data-theme="dark"] .records,:root[data-theme="dark"] .detail-box { background:var(--card); border-color:var(--line); color:var(--ink); box-shadow:0 18px 44px rgba(0,0,0,.26); }
    :root[data-theme="dark"] .btn { background:#102531; border-color:var(--line); color:var(--ink); }
    :root[data-theme="dark"] .btn:hover { background:#1d3d4d; border-color:rgba(54,214,191,.45); }
    :root[data-theme="dark"] .btn.primary { background:linear-gradient(180deg,#48e0ca,#18a99a); border-color:rgba(54,214,191,.72); color:#06251f; }
    :root[data-theme="dark"] .pending-indicator.has-pending { background:rgba(251,191,36,.16); border-color:rgba(251,191,36,.52); color:#fde68a; }
    :root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea { background:#08141d; border-color:var(--line); color:var(--ink); }
    :root[data-theme="dark"] .matrix th,:root[data-theme="dark"] .matrix td,:root[data-theme="dark"] .record { border-color:rgba(184,208,216,.14); }
    :root[data-theme="dark"] .matrix th.sticky-left,:root[data-theme="dark"] .matrix td.sticky-left,:root[data-theme="dark"] .matrix thead th { background:#132a37; color:var(--ink); }
    :root[data-theme="dark"] .matrix tbody tr:hover { background:rgba(24,52,66,.72); }
    :root[data-theme="dark"] .summary-badge,:root[data-theme="dark"] .legend .badge { background:rgba(24,52,66,.82); border-color:var(--line); color:#d8e7ed; }
    :root[data-theme="dark"] .t-paid { background:rgba(56,189,248,.18); color:#bae6fd; }
    :root[data-theme="dark"] .t-sick { background:rgba(251,113,133,.18); color:#fecdd3; }
    :root[data-theme="dark"] .t-unpaid { background:rgba(148,163,184,.16); color:#cbd5e1; }
    :root[data-theme="dark"] .t-study { background:rgba(74,222,128,.16); color:#bbf7d0; }
    :root[data-theme="dark"] .t-work { background:rgba(251,191,36,.18); color:#fde68a; }
    :root[data-theme="dark"] .user-comp.pos { color:#86efac; }
    :root[data-theme="dark"] .user-comp.neg { color:#fda4af; }
    :root[data-theme="dark"] .user-comp.neu { color:#cbd5e1; }
    @media (max-width: 1200px) {
      .layout { grid-template-columns: 1fr; min-height: 0; }
      .matrix-wrap { min-height: 58vh; }
      .records { height: 320px; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="page-brand">
        <img src="favicon.ico" alt="" width="44" height="44">
        <div>
          <h1 id="title">Leave Planner</h1>
          <div id="subtitle" class="muted">Monthly leave matrix and balances</div>
        </div>
      </div>
      <div class="row">
        <button id="langBtn" class="btn" type="button">BG</button>
        <a id="backBtn" class="btn" href="/">Back</a>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <button id="prevBtn" class="btn" type="button">Prev</button>
        <strong id="monthLabel">-</strong>
        <button id="nextBtn" class="btn" type="button">Next</button>
        <button id="pendingRequestsIndicator" class="btn pending-indicator hidden" type="button">Pending requests: 0</button>
        <span id="me" class="muted">-</span>
      </div>
      <div class="legend" style="margin-top:8px;">
        <span class="badge t-paid" id="legendPaid">Leave</span>
        <span class="badge t-sick" id="legendSick">Sick</span>
        <span class="badge t-unpaid" id="legendUnpaid">Unpaid</span>
        <span class="badge t-study" id="legendStudy">Study</span>
      </div>
      <div class="row" style="margin-top:8px;">
        <label style="min-width:170px;">
          <span id="lblFilterUser">Filter user</span>
          <select id="filterUserId"><option value="">All</option></select>
        </label>
        <label style="min-width:150px;">
          <span id="lblFilterType">Filter type</span>
          <select id="filterLeaveType">
            <option value="">all</option>
            <option value="paid">leave</option>
            <option value="sick">sick</option>
            <option value="unpaid">unpaid</option>
            <option value="study">study</option>
          </select>
        </label>
        <label>
          <span id="lblFilterFrom">From</span>
          <input id="filterFrom" type="date">
        </label>
        <label>
          <span id="lblFilterTo">To</span>
          <input id="filterTo" type="date">
        </label>
        <button id="applyFiltersBtn" class="btn" type="button">Apply</button>
        <button id="resetFiltersBtn" class="btn" type="button">Reset</button>
      </div>
      <div id="status" class="muted" style="margin-top:8px;"></div>
    </div>

    <div class="layout">
      <section class="card">
        <div class="matrix-wrap">
          <table class="matrix" id="matrixTable"></table>
        </div>
      </section>

      <h3 id="panelTitle" class="hidden">Details</h3>
      <div id="balancesSummary" class="hidden">-</div>
    </div>
  </div>

  <div id="detailsModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="detailsModalTitle" style="margin:0;">Details</h3>
        <button id="closeDetailsModalBtn" class="btn" type="button">Close</button>
      </div>
      <div id="detailsForUserLabel" class="muted">-</div>
      <div id="balances" class="detail-grid"></div>
      <div class="row" style="margin-top:10px;">
        <button id="openAddAbsenceModalBtn" class="btn primary" type="button">Add absence</button>
      </div>
      <h4 id="recordsTitle" style="margin:14px 0 6px;">Records</h4>
      <div id="records" class="records"></div>

      <div id="manageWrap" class="hidden" style="margin-top:10px;">
        <button id="openAllowanceModalBtn" class="btn" type="button">Set allowance</button>
      </div>
    </div>
  </div>

  <div id="addAbsenceModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="addLeaveTitle" style="margin:0;">Add leave</h3>
        <button id="closeAddAbsenceModalBtn" class="btn" type="button">Close</button>
      </div>
      <form id="recordForm">
        <label><span id="lblUser">User</span><select id="recordUserId"></select></label>
        <label><span id="lblType">Type</span>
          <select id="recordType">
            <option value="paid">leave</option>
            <option value="sick">sick</option>
            <option value="unpaid">unpaid</option>
            <option value="study">study</option>
          </select>
        </label>
        <div class="row">
          <label style="flex:1;"><span id="lblStart">Start</span><input id="recordStart" type="date" required></label>
          <label style="flex:1;"><span id="lblEnd">End</span><input id="recordEnd" type="date" required></label>
        </div>
        <label id="sourceYearWrap" class="hidden"><span id="lblSourceYear">Source year</span><select id="recordSourceYear"></select></label>
        <label><span id="lblNote">Note</span><textarea id="recordNote" maxlength="512"></textarea></label>
        <button id="addRecordBtn" class="btn primary" type="submit">Add</button>
      </form>
    </div>
  </div>

  <div id="allowanceModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="allowanceTitle" style="margin:0;">Set allowance</h3>
        <button id="closeAllowanceModalBtn" class="btn" type="button">Close</button>
      </div>
      <form id="allowanceForm">
        <label>
          <span id="lblAllowanceUser">User</span>
          <input id="allowanceUserName" type="text" readonly>
          <input id="allowanceUserId" type="hidden">
        </label>
        <div class="row">
          <label style="flex:1;"><span id="lblAllowanceType">Type</span>
            <select id="allowanceType"><option value="paid">leave</option><option value="study">study</option></select>
          </label>
          <label style="flex:1;"><span id="lblAllowanceOperation">Action</span>
            <select id="allowanceOperation">
              <option value="add">add</option>
              <option value="remove">remove</option>
              <option value="reset">reset</option>
            </select>
          </label>
        </div>
        <label id="allowanceDaysWrap"><span id="lblAllowanceDays">Days</span><input id="allowanceDays" type="number" step="0.5" min="0" max="366"></label>
        <button id="saveAllowanceBtn" class="btn" type="submit">Apply</button>
      </form>
    </div>
  </div>
  <div id="approveSubstituteModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="approveSubstituteTitle" style="margin:0;">Approve leave</h3>
        <button id="closeApproveSubstituteModalBtn" class="btn" type="button">Close</button>
      </div>
      <p id="approveSubstituteSummary" class="muted">-</p>
      <label>
        <span id="lblApproveSubstitute">Substitute</span>
        <select id="approveSubstituteUserId"></select>
      </label>
      <div class="row" style="justify-content:flex-end;margin-top:10px;">
        <button id="cancelApproveSubstituteBtn" class="btn" type="button">Cancel</button>
        <button id="confirmApproveSubstituteBtn" class="btn primary" type="button">Approve</button>
      </div>
    </div>
  </div>
  <script src="js/leave.js"></script>
</body>
</html>
